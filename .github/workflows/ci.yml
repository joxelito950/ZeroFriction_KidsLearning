# Ejecuta la checklist de calidad de SPECIFICATION.md (sección 5) en cada PR
# y en cada push a las ramas principales. Ver docs/td/TD-001-ci-github-actions.md.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Un commit nuevo en la misma rama cancela la ejecución anterior (C7).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Misma versión que el entorno local (C2). Se actualiza a la vez que la local.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Hive adapters)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage thresholds
        run: dart run tool/coverage_check.dart

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
