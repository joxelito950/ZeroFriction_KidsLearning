name: toddler_logic
description: Local-first cognitive development app for toddlers.
publish_to: 'none'

version: 0.0.1-beta+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  hive_ce: ^2.22.0
  intl: ^0.20.3
  meta: ^1.16.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.12.0
  mocktail: ^1.0.4

flutter:
  # Genera AppLocalizations a partir de lib/l10n/*.arb (HU-011, ver l10n.yaml).
  generate: true
  uses-material-design: true
